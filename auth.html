<!DOCTYPE html>
<html>
<head>
<title>RICH BIZNESS LOGIN</title>

<link rel="stylesheet" href="/styles/main.css">

<style>
.container input{
  display:block;
  margin:12px auto;
  padding:12px;
  width:220px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <h1>RICH BIZNESS LOGIN</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="main-btn" onclick="login()">
    TAP IN 🔥
  </button>

</div>

<script>
function login(){
  const email = document.getElementById("email").value;

  if(!email){
    alert("Enter email");
    return;
  }

  const user = {
    email,
    username: email.split("@")[0]
  };

  localStorage.setItem("rb_user", JSON.stringify(user));

  window.location.href = "/";
}
</script>

</body>
</html>
