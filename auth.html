<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rich Bizness — Auth</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  color:#00ffcc;
  font-family:system-ui;
}

.box{
  width:320px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

h2{
  text-align:center;
}

input{
  padding:12px;
  background:#001;
  border:1px solid rgba(0,255,200,.3);
  color:#00ffcc;
  border-radius:8px;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.status{
  font-size:12px;
  min-height:18px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">
  <h2>Rich Bizness Login</h2>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="login">Sign In</button>
  <button id="signup">Sign Up</button>

  <div class="status" id="status"></div>
</div>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* =========================
   🔑 YOUR SUPABASE CONFIG
========================= */
const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const status = document.getElementById("status");

/* =========================
   🔥 CREATE PROFILE SAFE
========================= */
async function ensureProfile(user){
  if(!user) return;

  const { data } = await supabase
    .from("profiles")
    .select("id")
    .eq("id", user.id)
    .single();

  if(!data){
    await supabase.from("profiles").insert({
      id: user.id,
      username: user.email,
      display_name: user.email
    });
  }
}

/* =========================
   SIGN UP
========================= */
document.getElementById("signup").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  status.innerText = "Creating account...";

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if(error){
    status.innerText = error.message;
    return;
  }

  await ensureProfile(data.user);

  status.innerText = "Account created. Now log in.";
};

/* =========================
   LOGIN
========================= */
document.getElementById("login").onclick = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  status.innerText = "Signing in...";

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    status.innerText = error.message;
    return;
  }

  await ensureProfile(data.user);

  status.innerText = "Success. Redirecting...";

  setTimeout(()=>{
    window.location.href = "/index.html";
  }, 800);
};

/* =========================
   SESSION AUTO LOGIN
========================= */
const { data } = await supabase.auth.getSession();

if(data.session){
  await ensureProfile(data.session.user);
  window.location.href = "/index.html";
}

</script>

</body>
</html>
