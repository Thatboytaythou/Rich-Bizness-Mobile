<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICH BIZNESS LOGIN</title>

<link rel="stylesheet" href="/styles/main.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.container input{
  display:block;
  margin:12px auto;
  padding:12px;
  width:240px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#111;
  color:#00ffcc;
  box-shadow:0 0 10px rgba(0,255,200,.3);
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

  <h1>TAP IN 🔥</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="main-btn" onclick="login()">LOGIN 🚀</button>
  <button class="secondary-btn" onclick="signup()">SIGN UP 🆕</button>

</div>

<script>

const supabase = window.supabase.createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

/* AUTO LOGIN */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    window.location.href = "/";
  }
})();

/* LOGIN */
async function login(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  window.location.href = "/";
}

/* SIGNUP */
async function signup(){

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signUp({
    email,
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Account created 🔥 Check your email");
}

</script>

</body>
</html>
