<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICH BIZNESS LOGIN</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  font-family:sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:400px;
  padding:30px;
  text-align:center;
}

h1{
  color:#00ffcc;
  font-size:28px;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:15px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  color:#000;
  font-size:16px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <h1>RICH BIZNESS LOGIN</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <!-- 🔥 TAP IN -->
  <button onclick="login()">TAP IN</button>

</div>

<script>
function login(){
  localStorage.setItem("rb_user", "true");
  window.location.href = "/";
}
</script>

</body>
</html>
