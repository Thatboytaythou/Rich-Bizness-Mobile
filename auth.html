<!DOCTYPE html>
<html>
<head>
<title>LOGIN</title>
<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

window.login = async ()=>{
  const email = emailEl.value;
  const password = passEl.value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    alert(error.message);
    return;
  }

  location.href="/";
};

window.signup = async ()=>{
  const email = emailEl.value;
  const password = passEl.value;

  const { error } = await supabase.auth.signUp({ email, password });

  if(error){
    alert(error.message);
    return;
  }

  alert("Signup success 🔥 now login");
};

const emailEl = document.getElementById("email");
const passEl = document.getElementById("password");
</script>
</head>

<body>

<div class="bg"></div>

<div class="container">
  <h1>TAP IN 🔥</h1>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button class="main-btn" onclick="login()">LOGIN</button>
  <button class="secondary-btn" onclick="signup()">SIGN UP</button>
</div>

</body>
</html>
