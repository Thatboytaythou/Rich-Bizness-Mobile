<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Rich Bizness LLC — Auth</title>

  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/omni-fx.css" />

  <style>
    body{
      overflow:hidden;
    }

    .auth-page{
      position:relative;
      z-index:80;
      width:min(760px,100%);
      min-height:100vh;
      margin:0 auto;
      padding:calc(24px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .auth-nav{
      position:absolute;
      top:calc(18px + env(safe-area-inset-top));
      left:18px;
      right:18px;
      display:flex;
      justify-content:space-between;
      z-index:120;
    }

    .auth-brand{
      text-align:center;
      font-family:Georgia,serif;
      line-height:.82;
      margin-bottom:22px;
      filter:drop-shadow(0 0 20px rgba(141,255,91,.35));
    }

    .auth-brand strong{
      display:block;
      font-size:clamp(42px,11vw,74px);
      color:#e2ca74;
    }

    .auth-brand small{
      display:block;
      margin-top:10px;
      letter-spacing:.34em;
      color:#ffe28a;
      font-weight:900;
    }

    .auth-card{
      position:relative;
      overflow:hidden;
      border-radius:34px;
      padding:24px;
      background:linear-gradient(180deg,rgba(18,28,18,.94),rgba(0,0,0,.9));
      border:1px solid rgba(141,255,91,.26);
      box-shadow:0 0 60px rgba(0,0,0,.86),0 0 44px rgba(141,255,91,.14);
      backdrop-filter:blur(22px);
    }

    .auth-card::before{
      content:"";
      position:absolute;
      inset:-40%;
      background:radial-gradient(circle,rgba(141,255,91,.16),transparent 48%);
      animation:rbAuraBreath 5s ease-in-out infinite;
      pointer-events:none;
    }

    .auth-content{
      position:relative;
      z-index:2;
    }

    .kicker{
      color:#8dff5b;
      font-size:12px;
      font-weight:950;
      letter-spacing:.22em;
      margin-bottom:8px;
    }

    h1{
      font-family:Georgia,serif;
      font-size:42px;
      line-height:.95;
      color:#e2ca74;
      margin-bottom:10px;
      text-shadow:0 0 18px rgba(141,255,91,.25);
    }

    .copy{
      color:#dfffd2;
      font-size:15px;
      line-height:1.45;
      margin-bottom:18px;
    }

    .form{
      display:flex;
      flex-direction:column;
      gap:13px;
    }

    label{
      color:#8dff5b;
      font-size:11px;
      letter-spacing:.16em;
      font-weight:950;
    }

    input{
      width:100%;
      border:none;
      outline:none;
      color:#fff;
      border-radius:18px;
      padding:15px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(141,255,91,.14);
      font-size:16px;
    }

    .actions{
      display:grid;
      gap:10px;
      margin-top:8px;
    }

    .primary-btn,
    .secondary-btn,
    .danger-btn{
      width:100%;
      border:none;
      outline:none;
      border-radius:18px;
      min-height:52px;
      font-weight:950;
      letter-spacing:.12em;
      font-size:14px;
    }

    .primary-btn{
      color:#081008;
      background:linear-gradient(to bottom,#e7ffc9,#8dff5b 55%,#4c7618);
      box-shadow:0 0 28px rgba(141,255,91,.38);
    }

    .secondary-btn{
      color:#dfffd2;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(141,255,91,.22);
    }

    .danger-btn{
      color:#ffe8a0;
      background:rgba(0,0,0,.52);
      border:1px solid rgba(255,219,123,.36);
    }

    .signed-panel{
      display:none;
      margin-top:18px;
      padding:16px;
      border-radius:24px;
      border:1px solid rgba(255,219,123,.28);
      background:rgba(0,0,0,.42);
    }

    .signed-panel.is-visible{
      display:block;
    }

    .signed-panel small{
      color:#8dff5b;
      letter-spacing:.14em;
      font-weight:900;
      display:block;
      margin-bottom:8px;
    }

    .signed-panel strong{
      display:block;
      font-size:18px;
      word-break:break-word;
      margin-bottom:12px;
    }

    .status{
      margin-top:14px;
      color:#8dff5b;
      font-size:12px;
      letter-spacing:.13em;
      font-weight:850;
      min-height:18px;
    }
  </style>
</head>

<body>
  <canvas id="engine"></canvas>

  <div class="omni-bg-glow"></div>
  <div class="omni-light-beams"></div>
  <div class="omni-particles"></div>
  <div class="omni-scanlines"></div>
  <div class="screen-vignette"></div>
  <div class="screen-noise"></div>

  <main class="auth-page">
    <nav class="auth-nav">
      <a class="icon" href="/index.html" aria-label="Home">‹</a>
      <a class="icon" href="/profile.html" aria-label="Profile">◈</a>
    </nav>

    <div class="auth-brand">
      <strong>RICH BIZNESS</strong>
      <small>LLC</small>
    </div>

    <section class="auth-card">
      <div class="auth-content">
        <div class="kicker">SECURE ACCESS</div>
        <h1>Tap In 💰</h1>

        <p class="copy">
          Sign in or create your Rich Bizness account to unlock the full cinematic platform.
        </p>

        <div class="form">
          <div>
            <label for="email">EMAIL</label>
            <input id="email" type="email" autocomplete="email" placeholder="you@email.com" />
          </div>

          <div>
            <label for="password">PASSWORD</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" />
          </div>

          <div class="actions">
            <button class="primary-btn" id="signInBtn" type="button">TAP IN 💰</button>
            <button class="secondary-btn" id="signUpBtn" type="button">CREATE ACCOUNT</button>
          </div>
        </div>

        <div class="signed-panel" id="signedPanel">
          <small>ALREADY TAPPED IN</small>
          <strong id="signedEmail">Signed in</strong>
          <button class="danger-btn" id="signOutBtn" type="button">IM OUT ✌🏽</button>
        </div>

        <div class="status" id="authStatus">BOOTING AUTH...</div>
      </div>
    </section>
  </main>

  <script type="module" src="/core/engine/omni-fx.js"></script>
  <script type="module" src="/core/pages/auth.js"></script>
</body>
</html>
