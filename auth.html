<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>

<body style="background:black;color:#00ffcc;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;">

<h1>RICH BIZNESS LOGIN</h1>

<input id="email" placeholder="Email" style="margin:10px;padding:10px;">
<input id="password" type="password" placeholder="Password" style="margin:10px;padding:10px;">

<button onclick="login()" style="padding:10px 20px;">TAP IN 🔥</button>

<script>
function login(){

  const email = document.getElementById("email").value;

  if(!email){
    alert("Enter email");
    return;
  }

  // 🔥 THIS IS THE KEY
  localStorage.setItem("rb_user", email);

  // go back to home
  window.location.href = "/";
}
</script>

</body>
</html>
