<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICH BIZNESS — OMNI CORE</title>

<link rel="stylesheet" href="/styles/main.css">

<style>

/* 🔥 EXTRA ELITE FX */
.ring{
  animation: pulse 4s infinite;
}

@keyframes pulse{
  0%{transform:scale(1); opacity:.8;}
  50%{transform:scale(1.05); opacity:1;}
  100%{transform:scale(1); opacity:.8;}
}

/* smoother feel */
.wheel{
  transition: transform .08s linear;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>

/* =========================
   USER
========================= */
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

/* =========================
   DATA
========================= */
const ITEMS = ["🌐","📡","🎵","🎮","🏆","🛒","⬆️","👤","💬","🔔"];
const LABELS = ["META","LIVE","MUSIC","GAMING","SPORTS","STORE","UPLOAD","PROFILE","MESSAGES","ALERTS"];

const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/upload.html",
  "/profile.html",
  "/messages.html",
  "/notifications.html"
];

/* =========================
   DOM
========================= */
const wheel = document.getElementById("wheel");
const screen = document.getElementById("screen");
const enterBtn = document.getElementById("enterBtn");

/* =========================
   STATE
========================= */
let rot = 0;
let vel = 0;

const step = (Math.PI * 2) / ITEMS.length;
const radius = 120;

/* =========================
   BUILD WHEEL (FIXED)
========================= */
ITEMS.forEach((icon,i)=>{

  const el = document.createElement("div");
  el.className = "seg";
  el.innerText = icon;

  const angle = i * step - Math.PI/2;

  el.dataset.angle = angle; // 🔥 key fix

  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  el.style.transform = `
    translate(-50%,-50%)
    translate(${x}px, ${y}px)
  `;

  el.onclick = () => {
    window.location.href = ROUTES[i];
  };

  wheel.appendChild(el);
});

/* =========================
   UPDATE (REAL FIX)
========================= */
function update(){

  wheel.style.transform = `rotate(${rot}rad)`;

  let index = Math.round(-rot / step) % ITEMS.length;
  if(index < 0) index += ITEMS.length;

  document.querySelectorAll(".seg").forEach((s,i)=>{

    const baseAngle = parseFloat(s.dataset.angle);

    const x = Math.cos(baseAngle) * radius;
    const y = Math.sin(baseAngle) * radius;

    const isActive = i === index;

    const rotateFix = -rot;

    s.style.transform = `
      translate(-50%,-50%)
      translate(${x}px, ${y}px)
      rotate(${rotateFix}rad)
      scale(${isActive ? 1.6 : 1})
    `;

    s.style.opacity = isActive ? 1 : 0.5;
  });

  screen.innerText = LABELS[index];
}

/* =========================
   LOOP
========================= */
function loop(){

  rot += vel;
  vel *= 0.92;

  if(Math.abs(vel) < 0.002){
    const snap = Math.round(rot / step) * step;
    rot += (snap - rot) * 0.12;
  }

  update();
  requestAnimationFrame(loop);
}

loop();

/* =========================
   TOUCH
========================= */
let startX = 0;

window.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e=>{
  const dx = e.touches[0].clientX - startX;
  vel = dx * 0.00035;
});

/* =========================
   ENTER
========================= */
enterBtn.onclick = ()=>{

  const user = getUser();

  if(!user){
    window.location.href = "/auth.html";
    return;
  }

  let index = Math.round(-rot / step) % ITEMS.length;
  if(index < 0) index += ITEMS.length;

  window.location.href = ROUTES[index];
};

/* =========================
   NAV
========================= */
function goProfile(){ location.href="/profile.html"; }
function goSettings(){ location.href="/setting.html"; }

/* =========================
   WELCOME
========================= */
const user = getUser();

if(user){
  screen.innerText = "WELCOME BACK\n" + (user.email || "USER");
}

</script>

</body>
</html>
