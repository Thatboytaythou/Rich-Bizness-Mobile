<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI</title>
<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

window.goProfile = () => location.href="/profile.html";
</script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>
const ITEMS = ["🌐","📡","🎵","🎮","🏆","🛒"];
const ROUTES = ["/meta.html","/live.html","/music.html","/gaming.html","/sports.html","/store.html"];

const wheel = document.getElementById("wheel");
let rot=0, vel=0;
const step=(Math.PI*2)/ITEMS.length;
const radius=110;

ITEMS.forEach((icon,i)=>{
  const el=document.createElement("div");
  el.className="seg";
  el.innerText=icon;

  const angle=i*step-Math.PI/2;
  el.style.transform=`
    translate(-50%,-50%)
    translate(${Math.cos(angle)*radius}px,${Math.sin(angle)*radius}px)
  `;

  wheel.appendChild(el);
});

function update(){
  wheel.style.transform=`rotate(${rot}rad)`;
  return Math.round(-rot/step)%ITEMS.length;
}

function loop(){
  rot+=vel;
  vel*=0.92;
  requestAnimationFrame(loop);
}
loop();

enterBtn.onclick=()=>{
  if(!window.user){
    location.href="/auth.html";
    return;
  }
  const i=update();
  location.href=ROUTES[i];
};
</script>

</body>
</html>
