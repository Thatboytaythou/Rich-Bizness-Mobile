<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI 3D</title>

<link rel="stylesheet" href="/styles/main.css">

<style>
/* ===== LAYERS FIXED ===== */
canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:2;
}

/* background behind */
.bg{
  position:fixed;
  inset:0;
  z-index:1;
}

/* UI always on top */
.topbar,
.enter{
  position:relative;
  z-index:10;
}
</style>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.158.0";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* =========================
   SUPABASE
========================= */
const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

/* NAV */
window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/settings.html";
window.goNotifications = () => location.href="/notifications.html";

/* ROUTES */
const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/gallery.html",
  "/podcast.html",
  "/store.html",
  "/messages.html"
];

/* =========================
   THREE ENGINE
========================= */

const scene = new THREE.Scene(); // 🚫 NO FOG

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.set(0,0,5);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({
  alpha:true,
  antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT (FIXED)
========================= */

scene.add(new THREE.AmbientLight(0xffffff, 2));

const light = new THREE.PointLight(0x00ffcc, 4);
light.position.set(0,0,5);
scene.add(light);

/* =========================
   CORE
========================= */

const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.2,32,32),
  new THREE.MeshStandardMaterial({
    color:0x00ffcc,
    emissive:0x00ffcc,
    emissiveIntensity:2
  })
);

scene.add(core);

/* =========================
   RING
========================= */

const items = [];
const radius = 3;
const count = 10;
const step = (Math.PI*2)/count;

for(let i=0;i<count;i++){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.35,16,16),
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      emissive:0x00ffcc,
      emissiveIntensity:1
    })
  );

  mesh.userData.index = i;
  scene.add(mesh);
  items.push(mesh);
}

/* =========================
   MOTION (NO DRAG)
========================= */

let velocity = 0;
let rotation = 0;
let dragging = false;

function animate(){
  requestAnimationFrame(animate);

  rotation += velocity;

  if(!dragging){
    velocity *= 0.85;

    if(Math.abs(velocity) < 0.001){
      velocity = 0;

      const snap = Math.round(rotation / step) * step;
      rotation = snap;
    }
  }

  let active = 0;
  let best = -Infinity;

  items.forEach((m,i)=>{
    const angle = i*step + rotation;

    m.position.x = Math.cos(angle)*radius;
    m.position.y = Math.sin(angle)*1.2;
    m.position.z = Math.sin(angle)*radius;

    const depth = (m.position.z + radius)/(radius*2);
    const scale = 0.7 + depth*1.2;
    m.scale.set(scale,scale,scale);

    if(m.position.z > best){
      best = m.position.z;
      active = i;
    }
  });

  window.activeIndex = active;

  core.rotation.y += 0.01;

  renderer.render(scene,camera);
}
animate();

/* =========================
   CONTROLS
========================= */

let lastX = 0;

window.addEventListener("touchstart", e=>{
  dragging = true;
  lastX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e=>{
  const dx = e.touches[0].clientX - lastX;
  velocity = dx * 0.0025;
  lastX = e.touches[0].clientX;
});

window.addEventListener("touchend", ()=>{
  dragging = false;
});

/* =========================
   CLICK
========================= */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", e=>{
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hit = raycaster.intersectObjects(items);

  if(hit.length){
    location.href = ROUTES[hit[0].object.userData.index];
  }
});

/* =========================
   ENTER
========================= */

window.enter = ()=>{
  if(!window.user){
    location.href="/auth.html";
    return;
  }

  location.href = ROUTES[window.activeIndex];
};

/* =========================
   RESIZE
========================= */

window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="right-icons">
    <div class="icon" onclick="goNotifications()">🔔</div>
    <div class="icon" onclick="goSettings()">⚙️</div>
  </div>
</div>

<div class="enter" onclick="enter()">ACTIVATE</div>

</body>
</html>
