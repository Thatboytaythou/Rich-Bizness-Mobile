<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Rich Bizness LLC — Cinematic Universal Omni Dial</title>

  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/omni-dial.css" />
  <link rel="stylesheet" href="/styles/omni-portal.css" />
  <link rel="stylesheet" href="/styles/omni-fx.css" />
</head>

<body>
  <canvas id="engine"></canvas>

  <div class="omni-bg-glow"></div>
  <div class="omni-light-beams"></div>
  <div class="omni-particles"></div>
  <div class="omni-scanlines"></div>

  <div class="screen-vignette"></div>
  <div class="screen-noise"></div>

  <header class="topbar">
    <div class="top-left">
      <div class="welcome-block">
        <div class="welcome-text" id="welcomeStatus">WELCOME BACK</div>
        <div class="welcome-name" id="homeUserName" data-user-name>Thatboytaythou</div>
      </div>

      <button class="rank-panel" id="profileShortcut" data-route="/profile.html" type="button">
        <div class="rank-icon" id="homeAvatar">◈</div>
        <div class="rank-copy">
          <small>RICH LEVEL</small>
          <strong id="homeRichLevel">MAX</strong>
        </div>
      </button>
    </div>

    <div class="top-center">
      <div class="brand-lockup">
        <span class="brand-rich">RICH</span>
        <span class="brand-biz">BIZNESS</span>
        <span class="brand-llc">LLC</span>
      </div>
    </div>

    <div class="top-right">
      <button
        class="icon notification"
        id="notificationBtn"
        data-route="/notifications.html"
        type="button"
        aria-label="Notifications"
      >
        🔔
      </button>

      <button class="icon" id="menuBtn" type="button" aria-label="Open Menu">
        ☰
      </button>
    </div>
  </header>

  <aside class="quick-menu" id="quickMenu">
    <a href="/index.html">Home</a>
    <a href="/feed.html">Feed</a>
    <a href="/watch.html">Watch</a>
    <a href="/live.html">Live</a>
    <a href="/music.html">Music</a>
    <a href="/gaming.html">Gaming</a>
    <a href="/sports.html">Sports</a>
    <a href="/gallery.html">Gallery</a>
    <a href="/upload.html">Upload</a>
    <a href="/store.html">Store</a>
    <a href="/meta.html">Metaverse</a>
    <a href="/messages.html">Messages</a>
    <a href="/notifications.html">Notifications</a>
    <a href="/profile.html">Profile</a>
    <a href="/profile.html?mode=edit">Edit Profile</a>
    <a href="/setting.html">Settings</a>
  </aside>

  <main class="dial-ui" id="dialUi">
    <button class="dial-card card-feed" data-dial-card="feed" data-route="/feed.html" type="button">
      <div class="dial-icon">◆</div>
      <div class="dial-title">FEED</div>
      <div class="dial-sub" id="feedDialSub">SOCIAL</div>
    </button>

    <button class="dial-card card-watch" data-dial-card="watch" data-route="/watch.html" type="button">
      <div class="dial-icon">▶</div>
      <div class="dial-title">WATCH</div>
      <div class="dial-sub" id="watchDialSub">VIEW</div>
    </button>

    <button class="dial-card card-live" data-dial-card="live" data-route="/live.html" type="button">
      <div class="dial-icon">◉</div>
      <div class="dial-title">LIVE</div>
      <div class="dial-sub" id="liveDialSub">STREAM</div>
    </button>

    <button class="dial-card card-music" data-dial-card="music" data-route="/music.html" type="button">
      <div class="dial-icon">♪</div>
      <div class="dial-title">MUSIC</div>
      <div class="dial-sub" id="musicDialSub">VIBES</div>
    </button>

    <button class="dial-card card-gaming" data-dial-card="gaming" data-route="/gaming.html" type="button">
      <div class="dial-icon">🎮</div>
      <div class="dial-title">GAMING</div>
      <div class="dial-sub" id="gamingDialSub">PLAY</div>
    </button>

    <button class="dial-card card-sports" data-dial-card="sports" data-route="/sports.html" type="button">
      <div class="dial-icon">🏆</div>
      <div class="dial-title">SPORTS</div>
      <div class="dial-sub" id="sportsDialSub">HIGHLIGHTS</div>
    </button>

    <button class="dial-card card-gallery" data-dial-card="gallery" data-route="/gallery.html" type="button">
      <div class="dial-icon">▣</div>
      <div class="dial-title">GALLERY</div>
      <div class="dial-sub" id="galleryDialSub">PHOTOS</div>
    </button>

    <button class="dial-card card-upload" data-dial-card="upload" data-route="/upload.html" type="button">
      <div class="dial-icon">⬆</div>
      <div class="dial-title">UPLOAD</div>
      <div class="dial-sub" id="uploadDialSub">CONTENT</div>
    </button>

    <button class="dial-card card-store" data-dial-card="store" data-route="/store.html" type="button">
      <div class="dial-icon">🛒</div>
      <div class="dial-title">STORE</div>
      <div class="dial-sub" id="storeDialSub">SHOP</div>
    </button>

    <button class="dial-card card-meta" data-dial-card="meta" data-route="/meta.html" type="button">
      <div class="dial-icon">◎</div>
      <div class="dial-title">META</div>
      <div class="dial-sub" id="metaDialSub">VERSE</div>
    </button>
  </main>

  <section class="center-ui" id="centerPortal">
    <div class="portal-core">
      <div class="portal-door portal-door-left"></div>
      <div class="portal-door portal-door-right"></div>

      <div class="portal-ring portal-ring-outer"></div>
      <div class="portal-ring portal-ring-mid"></div>
      <div class="portal-ring portal-ring-inner"></div>

      <div class="portal-inner">
        <div class="portal-title">
          <span>RICH</span>
          <span>BIZNESS</span>
          <small id="portalStatus">LLC</small>
        </div>
      </div>

      <div class="portal-flare"></div>
    </div>
  </section>

  <button class="enter" id="activateBtn" type="button">
    <span class="enter-main" id="activateMain">ACTIVATE</span>
    <span class="enter-sub" id="activateSub">ENTER LIVE</span>
  </button>

  <footer class="stats">
    <div class="stat-card">
      <span class="stat-icon">▰</span>
      <small>BALANCE</small>
      <strong id="homeBalance">$0.00</strong>
    </div>

    <div class="stat-card">
      <span class="stat-icon">♛</span>
      <small>RICH POINTS</small>
      <strong id="homeRichPoints">0</strong>
    </div>

    <div class="stat-card">
      <span class="stat-icon">🛡</span>
      <small>RANK</small>
      <strong id="homeRank">BIZ LEGEND</strong>
    </div>

    <div class="stat-card">
      <span class="stat-icon">👥</span>
      <small>ONLINE</small>
      <strong id="homeOnline">0</strong>
    </div>
  </footer>

  <script>
    window.RB_ROUTES = {
      feed: "/feed.html",
      watch: "/watch.html",
      live: "/live.html",
      music: "/music.html",
      gaming: "/gaming.html",
      sports: "/sports.html",
      gallery: "/gallery.html",
      upload: "/upload.html",
      store: "/store.html",
      meta: "/meta.html"
    };

    window.RB_ACTIVE_KEY = "live";
    window.RB_ACTIVE_ROUTE = "/live.html";
    window.RB_DIAL_CLICK_TO_OPEN = false;

    function setActiveDial(key, fromEngine = false) {
      if (!key) return;

      const route = window.RB_ROUTES[key];

      if (route) {
        window.RB_ACTIVE_KEY = key;
        window.RB_ACTIVE_ROUTE = route;
      }

      document.querySelectorAll("[data-dial-card]").forEach((card) => {
        card.classList.toggle("is-active", card.dataset.dialCard === key);
      });

      const activeCard = document.querySelector(`[data-dial-card="${key}"]`);
      const title = activeCard?.querySelector(".dial-title")?.textContent || "RICH";

      const activateSub = document.getElementById("activateSub");
      const portalStatus = document.getElementById("portalStatus");
      const centerPortal = document.getElementById("centerPortal");

      if (activateSub) activateSub.textContent = `ENTER ${title}`;
      if (portalStatus) portalStatus.textContent = title;
      if (centerPortal) centerPortal.dataset.activePortal = key;

      if (!fromEngine && typeof window.RB_spinTo === "function") {
        window.RB_spinTo(key);
      }
    }

    function goToRoute(route) {
      if (!route) return;
      window.location.href = route;
    }

    function enterWorld() {
      const centerPortal = document.getElementById("centerPortal");

      if (centerPortal) {
        centerPortal.classList.add("portal-opening");
      }

      setTimeout(() => {
        goToRoute(window.RB_ACTIVE_ROUTE || "/feed.html");
      }, 520);
    }

    function toggleMenu() {
      document.getElementById("quickMenu")?.classList.toggle("open");
    }

    window.enterWorld = enterWorld;
    window.enter = enterWorld;
    window.setActiveDial = setActiveDial;

    document.addEventListener("click", (event) => {
      const menuBtn = event.target.closest("#menuBtn");

      if (menuBtn) {
        event.preventDefault();
        toggleMenu();
        return;
      }

      const quickMenu = document.getElementById("quickMenu");

      if (
        quickMenu?.classList.contains("open") &&
        !event.target.closest("#quickMenu") &&
        !event.target.closest("#menuBtn")
      ) {
        quickMenu.classList.remove("open");
      }

      const activateBtn = event.target.closest("#activateBtn");

      if (activateBtn) {
        event.preventDefault();
        enterWorld();
        return;
      }

      const dialCard = event.target.closest("[data-dial-card]");

      if (dialCard) {
        event.preventDefault();
        setActiveDial(dialCard.dataset.dialCard);
        return;
      }

      const directRoute = event.target.closest("[data-route]");

      if (directRoute) {
        event.preventDefault();
        goToRoute(directRoute.dataset.route);
      }
    });

    setActiveDial("live", true);
  </script>

  <script type="module" src="/core/engine/omni-engine.js"></script>
  <script type="module" src="/core/engine/omni-fx.js"></script>
  <script type="module" src="/core/pages/index.js"></script>
</body>
</html>
