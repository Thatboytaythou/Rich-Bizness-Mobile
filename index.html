<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RICH BIZNESS — OMNI CORE</title>

<link rel="stylesheet" href="/styles/main.css">
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>

/* 🔐 USER */
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;
  return JSON.parse(raw);
}

/* DATA */
const ITEMS = ["🌐","📡","🎵","🎮","🏆","🛒","⬆️","👤","💬","🔔"];
const LABELS = ["META","LIVE","MUSIC","GAMING","SPORTS","STORE","UPLOAD","PROFILE","MESSAGES","ALERTS"];

const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/upload.html",
  "/profile.html",
  "/messages.html",
  "/notifications.html"
];

const wheel = document.getElementById("wheel");
const screen = document.getElementById("screen");
const enterBtn = document.getElementById("enterBtn");

let rot = 0;
let vel = 0;

const step = (Math.PI*2)/ITEMS.length;
const radius = 120;

/* BUILD */
ITEMS.forEach((icon,i)=>{
  const el = document.createElement("div");
  el.className = "seg";
  el.innerText = icon;

  const angle = i * step - Math.PI/2;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  el.style.transform = `
    translate(-50%,-50%)
    translate(${x}px, ${y}px)
  `;

  el.onclick = () => window.location.href = ROUTES[i];

  wheel.appendChild(el);
});

/* LOOP */
function loop(){
  rot += vel;
  vel *= 0.92;

  if(Math.abs(vel)<0.002){
    const snap = Math.round(rot/step)*step;
    rot += (snap-rot)*0.12;
  }

  update();
  requestAnimationFrame(loop);
}

function update(){
  wheel.style.transform = `rotate(${rot}rad)`;

  let index = Math.round(-rot/step)%ITEMS.length;
  if(index<0) index+=ITEMS.length;

  document.querySelectorAll(".seg").forEach((s,i)=>{
    s.classList.toggle("active", i===index);
  });

  screen.innerText = LABELS[index];
}

loop();

/* TOUCH */
let startX=0;
window.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});
window.addEventListener("touchmove", e=>{
  vel = (e.touches[0].clientX - startX) * 0.0004;
});

/* ENTER */
enterBtn.onclick = ()=>{
  const user = getUser();
  if(!user){
    window.location.href = "/auth.html";
    return;
  }

  const index = Math.round(-rot/step)%ITEMS.length;
  const safeIndex = (index + ITEMS.length) % ITEMS.length;

  window.location.href = ROUTES[safeIndex];
};

/* NAV */
function goProfile(){ location.href="/profile.html"; }
function goSettings(){ location.href="/setting.html"; }

/* WELCOME */
const user = getUser();
if(user){
  screen.innerText = "WELCOME BACK\n" + user.username;
}

</script>

</body>
</html>
