<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI 3D</title>

<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.158.0";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* =========================
   SUPABASE
========================= */
const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/settings.html";
window.goNotifications = () => location.href="/notifications.html";

/* =========================
   ROUTES
========================= */
const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/gallery.html",
  "/podcast.html",
  "/store.html",
  "/messages.html"
];

/* =========================
   THREE SETUP
========================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

// 🔥 FIXED CAMERA
camera.position.set(0, 0, 7);

const renderer = new THREE.WebGLRenderer({
  alpha:true,
  antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */
const light = new THREE.PointLight(0x00ffcc, 3);
light.position.set(5,5,5);
scene.add(light);

/* =========================
   CORE (CENTER)
========================= */
const coreGeo = new THREE.SphereGeometry(1.3,32,32);
const coreMat = new THREE.MeshStandardMaterial({
  color:0x00ffcc,
  emissive:0x00ffcc,
  emissiveIntensity:2
});

const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

/* =========================
   ITEMS (REAL 3D RING)
========================= */
const items = [];
const radius = 3.2;
const count = 10;

for(let i=0;i<count;i++){
  const geo = new THREE.SphereGeometry(0.35,16,16);

  const mat = new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0x00ffcc,
    emissiveIntensity:0.6
  });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.userData.index = i;

  scene.add(mesh);
  items.push(mesh);
}

/* =========================
   MOTION ENGINE
========================= */
let velocity = 0;
let rotation = 0;
let isTouching = false;

function animate(){
  requestAnimationFrame(animate);

  rotation += velocity;
  velocity *= 0.92;

  // 🔥 snap lock (NO DRIFT)
  if(!isTouching && Math.abs(velocity) < 0.002){
    const step = (Math.PI*2)/count;
    const snap = Math.round(rotation / step) * step;
    rotation += (snap - rotation) * 0.1;
  }

  let closestIndex = 0;
  let best = -Infinity;

  items.forEach((m,i)=>{
    const angle = (i/count)*Math.PI*2 + rotation;

    // 🔥 TRUE 3D POSITIONS
    m.position.x = Math.cos(angle) * radius;
    m.position.y = Math.sin(angle) * 1.2;
    m.position.z = Math.sin(angle) * radius;

    // 🔥 DEPTH SCALE
    const depth = (m.position.z + radius) / (radius * 2);
    const scale = 0.7 + depth * 0.9;
    m.scale.set(scale, scale, scale);

    // 🔥 GLOW BASED ON FRONT
    m.material.emissiveIntensity = 0.4 + depth * 1.5;

    if(m.position.z > best){
      best = m.position.z;
      closestIndex = i;
    }
  });

  window.activeIndex = closestIndex;

  core.rotation.y += 0.01;

  renderer.render(scene,camera);
}
animate();

/* =========================
   TOUCH CONTROL
========================= */
let lastX = 0;

window.addEventListener("touchstart", e=>{
  isTouching = true;
  lastX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e=>{
  const x = e.touches[0].clientX;
  const dx = x - lastX;

  velocity = dx * 0.003;
  lastX = x;
});

window.addEventListener("touchend", ()=>{
  isTouching = false;
});

/* =========================
   CLICK DETECTION
========================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event)=>{
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(items);

  if(intersects.length > 0){
    const i = intersects[0].object.userData.index;
    location.href = ROUTES[i];
  }
});

/* =========================
   ENTER BUTTON
========================= */
window.enter = ()=>{
  if(!window.user){
    location.href="/auth.html";
    return;
  }

  location.href = ROUTES[window.activeIndex];
};
</script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="right-icons">
    <div class="icon" onclick="goNotifications()">🔔</div>
    <div class="icon" onclick="goSettings()">⚙️</div>
  </div>
</div>

<div class="enter" onclick="enter()">ACTIVATE</div>

</body>
</html>
