<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI 3D</title>

<link rel="stylesheet" href="/styles/main.css">

<style>
/* 🔥 FIX: make canvas sit BEHIND UI */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:1;
}

/* UI stays on top */
.bg, .topbar, .enter{
  position:relative;
  z-index:10;
}
</style>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.158.0";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* =========================
   SUPABASE
========================= */
const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

/* NAV */
window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/settings.html";
window.goNotifications = () => location.href="/notifications.html";

/* ROUTES */
const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/gallery.html",
  "/podcast.html",
  "/store.html",
  "/messages.html"
];

/* =========================
   THREE CORE
========================= */

const scene = new THREE.Scene();

/* 🔥 ADD DEPTH (this was missing) */
scene.fog = new THREE.Fog(0x000000, 5, 15);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.set(0,0,7);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHTING
========================= */

const light1 = new THREE.PointLight(0x00ffcc, 3);
light1.position.set(5,5,5);

const light2 = new THREE.PointLight(0x00ffcc, 2);
light2.position.set(-5,-5,5);

scene.add(light1, light2);

/* =========================
   CORE
========================= */

const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.3,32,32),
  new THREE.MeshStandardMaterial({
    color:0x00ffcc,
    emissive:0x00ffcc,
    emissiveIntensity:2
  })
);

scene.add(core);

/* =========================
   RING NODES
========================= */

const items = [];
const radius = 3.2;
const count = 10;

for(let i=0;i<count;i++){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.35,16,16),
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      emissive:0x00ffcc,
      emissiveIntensity:1
    })
  );

  mesh.userData.index = i;
  scene.add(mesh);
  items.push(mesh);
}

/* =========================
   MOTION ENGINE (FIXED)
========================= */

let velocity = 0;
let rotation = 0;
let isDragging = false;

function animate(){
  requestAnimationFrame(animate);

  rotation += velocity;

  /* 🔥 FIXED SMOOTH STOP */
  velocity *= 0.94;

  const step = (Math.PI*2)/count;

  if(!isDragging && Math.abs(velocity) < 0.001){
    const snap = Math.round(rotation / step) * step;
    rotation += (snap - rotation) * 0.15;
  }

  let closestIndex = 0;
  let best = -Infinity;

  items.forEach((m,i)=>{
    const angle = (i/count)*Math.PI*2 + rotation;

    m.position.x = Math.cos(angle) * radius;
    m.position.y = Math.sin(angle) * 1.2;
    m.position.z = Math.sin(angle) * radius;

    const depth = (m.position.z + radius) / (radius*2);
    const scale = 0.7 + depth * 1.2;
    m.scale.set(scale, scale, scale);

    m.material.emissiveIntensity = 0.5 + depth * 2;

    if(m.position.z > best){
      best = m.position.z;
      closestIndex = i;
    }
  });

  window.activeIndex = closestIndex;

  core.rotation.y += 0.01;

  renderer.render(scene,camera);
}
animate();

/* =========================
   CONTROLS (FIXED BOTH)
========================= */

let lastX = 0;

/* TOUCH */
window.addEventListener("touchstart", e=>{
  isDragging = true;
  lastX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e=>{
  const x = e.touches[0].clientX;
  const dx = x - lastX;

  velocity = dx * 0.003;
  lastX = x;
});

window.addEventListener("touchend", ()=>{
  isDragging = false;
});

/* MOUSE (YOU WERE MISSING THIS) */
window.addEventListener("mousedown", e=>{
  isDragging = true;
  lastX = e.clientX;
});

window.addEventListener("mousemove", e=>{
  if(!isDragging) return;

  const dx = e.clientX - lastX;
  velocity = dx * 0.002;
  lastX = e.clientX;
});

window.addEventListener("mouseup", ()=>{
  isDragging = false;
});

/* =========================
   CLICK
========================= */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", e=>{
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hit = raycaster.intersectObjects(items);

  if(hit.length){
    location.href = ROUTES[hit[0].object.userData.index];
  }
});

/* =========================
   ENTER
========================= */

window.enter = ()=>{
  if(!window.user){
    location.href="/auth.html";
    return;
  }
  location.href = ROUTES[window.activeIndex];
};

/* =========================
   RESIZE FIX (YOU WERE MISSING)
========================= */

window.addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="right-icons">
    <div class="icon" onclick="goNotifications()">🔔</div>
    <div class="icon" onclick="goSettings()">⚙️</div>
  </div>
</div>

<div class="enter" onclick="enter()">ACTIVATE</div>

</body>
</html>
