<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Rich Bizness LLC — Omni Dial</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>

<body>

  <canvas id="engine"></canvas>

  <div class="screen-vignette"></div>
  <div class="screen-noise"></div>

  <header class="topbar">

    <div class="top-left">
      <div class="welcome-block">
        <div class="welcome-text">WELCOME BACK</div>
        <div class="welcome-name" data-user-name>Thatboytaythou</div>
      </div>

      <div class="rank-panel">
        <div class="rank-icon">◈</div>
        <div class="rank-copy">
          <small>RICH LEVEL</small>
          <strong>MAX</strong>
        </div>
      </div>
    </div>

    <div class="top-center">
      <div class="brand-lockup">
        <span class="brand-rich">RICH</span>
        <span class="brand-biz">BIZNESS</span>
        <span class="brand-llc">LLC</span>
      </div>
    </div>

    <div class="top-right">
      <button class="icon notification" data-route="/notifications.html" type="button" aria-label="Notifications">
        🔔
      </button>

      <button class="icon" id="menuBtn" type="button" aria-label="Open Menu">
        ☰
      </button>
    </div>

  </header>

  <aside class="quick-menu" id="quickMenu">
    <a href="/index.html">Home</a>
    <a href="/feed.html">Feed</a>
    <a href="/watch.html">Watch</a>
    <a href="/live.html">Live</a>
    <a href="/music.html">Music</a>
    <a href="/gaming.html">Gaming</a>
    <a href="/sports.html">Sports</a>
    <a href="/gallery.html">Gallery</a>
    <a href="/upload.html">Upload</a>
    <a href="/store.html">Store</a>
    <a href="/metaverse.html">Metaverse</a>
    <a href="/messages.html">Messages</a>
    <a href="/notifications.html">Notifications</a>
    <a href="/profile.html">Profile</a>
  </aside>

  <main class="dial-ui" id="dialUi">

    <button class="dial-card top-card" data-dial-card="live" data-route="/live.html" type="button">
      <div class="dial-icon">◉</div>
      <div class="dial-title">LIVE</div>
      <div class="dial-sub">STREAM</div>
    </button>

    <button class="dial-card top-left-card" data-dial-card="gallery" data-route="/gallery.html" type="button">
      <div class="dial-icon">▣</div>
      <div class="dial-title">GALLERY</div>
      <div class="dial-sub">PHOTOS</div>
    </button>

    <button class="dial-card top-right-card" data-dial-card="music" data-route="/music.html" type="button">
      <div class="dial-icon">♪</div>
      <div class="dial-title">MUSIC</div>
      <div class="dial-sub">VIBES</div>
    </button>

    <button class="dial-card left-card" data-dial-card="upload" data-route="/upload.html" type="button">
      <div class="dial-icon">⬆</div>
      <div class="dial-title">UPLOAD</div>
      <div class="dial-sub">CONTENT</div>
    </button>

    <button class="dial-card right-card" data-dial-card="gaming" data-route="/gaming.html" type="button">
      <div class="dial-icon">🎮</div>
      <div class="dial-title">GAMING</div>
      <div class="dial-sub">PLAY</div>
    </button>

    <button class="dial-card bottom-left-card" data-dial-card="sports" data-route="/sports.html" type="button">
      <div class="dial-icon">🏆</div>
      <div class="dial-title">SPORTS</div>
      <div class="dial-sub">HIGHLIGHTS</div>
    </button>

    <button class="dial-card bottom-card" data-dial-card="meta" data-route="/metaverse.html" type="button">
      <div class="dial-icon">◎</div>
      <div class="dial-title">META</div>
      <div class="dial-sub">VERSE</div>
    </button>

    <button class="dial-card bottom-right-card" data-dial-card="store" data-route="/store.html" type="button">
      <div class="dial-icon">🛒</div>
      <div class="dial-title">STORE</div>
      <div class="dial-sub">SHOP</div>
    </button>

  </main>

  <section class="center-ui">
    <div class="portal-core">
      <div class="portal-inner">
        <div class="portal-title">
          <span>RICH</span>
          <span>BIZNESS</span>
          <small>LLC</small>
        </div>
      </div>
    </div>
  </section>

  <button class="enter" id="activateBtn" type="button">
    <span class="enter-main">ACTIVATE</span>
    <span class="enter-sub">TAP TO ENTER</span>
  </button>

  <footer class="stats">
    <div class="stat-card">
      <span class="stat-icon">▰</span>
      <small>BALANCE</small>
      <strong>$10,890.00</strong>
    </div>

    <div class="stat-card">
      <span class="stat-icon">♛</span>
      <small>RICH POINTS</small>
      <strong>28,450</strong>
    </div>

    <div class="stat-card">
      <span class="stat-icon">🛡</span>
      <small>RANK</small>
      <strong>BIZ LEGEND</strong>
    </div>

    <div class="stat-card">
      <span class="stat-icon">👥</span>
      <small>ONLINE</small>
      <strong>1,245</strong>
    </div>
  </footer>

  <script>
    window.RB_ROUTES = {
      gallery: "/gallery.html",
      live: "/live.html",
      music: "/music.html",
      gaming: "/gaming.html",
      store: "/store.html",
      meta: "/metaverse.html",
      sports: "/sports.html",
      upload: "/upload.html"
    };

    window.RB_ACTIVE_KEY = "live";
    window.RB_ACTIVE_ROUTE = "/live.html";
    window.RB_DIAL_CLICK_TO_OPEN = false;

    function setActiveDial(key, fromEngine = false) {
      if (!key) return;

      const route = window.RB_ROUTES[key];

      if (route) {
        window.RB_ACTIVE_KEY = key;
        window.RB_ACTIVE_ROUTE = route;
      }

      document.querySelectorAll("[data-dial-card]").forEach((card) => {
        card.classList.toggle("is-active", card.dataset.dialCard === key);
      });

      if (!fromEngine && typeof window.RB_spinTo === "function") {
        window.RB_spinTo(key);
      }
    }

    function goToRoute(route) {
      if (!route) return;
      window.location.href = route;
    }

    function enterWorld() {
      goToRoute(window.RB_ACTIVE_ROUTE || "/feed.html");
    }

    function toggleMenu() {
      document.getElementById("quickMenu")?.classList.toggle("open");
    }

    window.enterWorld = enterWorld;
    window.enter = enterWorld;
    window.setActiveDial = setActiveDial;

    document.addEventListener("click", (event) => {
      const menuBtn = event.target.closest("#menuBtn");

      if (menuBtn) {
        event.preventDefault();
        toggleMenu();
        return;
      }

      const activateBtn = event.target.closest("#activateBtn");

      if (activateBtn) {
        event.preventDefault();
        enterWorld();
        return;
      }

      const dialCard = event.target.closest("[data-dial-card]");

      if (dialCard) {
        event.preventDefault();
        setActiveDial(dialCard.dataset.dialCard);
        return;
      }

      const directRoute = event.target.closest("[data-route]");

      if (directRoute) {
        event.preventDefault();
        goToRoute(directRoute.dataset.route);
      }
    });

    setActiveDial("live");
  </script>

  <script type="module" src="/core/engine/omni-engine.js"></script>

</body>
</html>
