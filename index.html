<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI</title>
<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

window.goProfile = () => location.href="/profile.html";
</script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>
const ITEMS = ["🌐","📡","🎵","🎮","🏆","🛒"];
const LABELS = ["META","LIVE","MUSIC","GAMING","SPORTS","STORE"];
const ROUTES = ["/meta.html","/live.html","/music.html","/gaming.html","/sports.html","/store.html"];

const wheel = document.getElementById("wheel");
const screen = document.getElementById("screen");
const enterBtn = document.getElementById("enterBtn");

let rot = 0;
let vel = 0;

const step = (Math.PI * 2) / ITEMS.length;
const radius = 110;

/* BUILD WHEEL */
ITEMS.forEach((icon,i)=>{
  const el = document.createElement("div");
  el.className = "seg";
  el.innerText = icon;

  const angle = i * step - Math.PI/2;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  el.style.transform = `
    translate(-50%,-50%)
    translate(${x}px, ${y}px)
  `;

  el.onclick = () => {
    window.location.href = ROUTES[i];
  };

  wheel.appendChild(el);
});

/* UPDATE STATE */
function update(){
  wheel.style.transform = `rotate(${rot}rad)`;

  let index = Math.round(-rot / step) % ITEMS.length;
  if(index < 0) index += ITEMS.length;

  document.querySelectorAll(".seg").forEach((el,i)=>{
    el.classList.toggle("active", i === index);
  });

  screen.innerText = LABELS[index];

  return index;
}

/* LOOP + SNAP */
function loop(){
  rot += vel;
  vel *= 0.92;

  // 🔥 snap when slowing down
  if(Math.abs(vel) < 0.002){
    const snap = Math.round(rot / step) * step;
    rot += (snap - rot) * 0.12;
  }

  update();
  requestAnimationFrame(loop);
}
loop();

/* TOUCH CONTROLS */
let startX = 0;

window.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e=>{
  const dx = e.touches[0].clientX - startX;
  vel = dx * 0.0005;
});

/* ENTER BUTTON */
enterBtn.onclick = ()=>{
  if(!window.user){
    window.location.href="/auth.html";
    return;
  }

  const index = update();
  window.location.href = ROUTES[index];
};
</script>

</body>
</html>
