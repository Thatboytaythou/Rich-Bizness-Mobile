<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNI CORE</title>
<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

// CHECK LOGIN
const { data: { user } } = await supabase.auth.getUser();

window.currentUser = user;

if(user){
  document.getElementById("screen").innerText =
    "WELCOME BACK\n" + user.email;
}

window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/setting.html";
</script>

</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>

// ENTER BUTTON FIX
document.getElementById("enterBtn").onclick = () => {

  if(!window.currentUser){
    window.location.href = "/auth.html";
    return;
  }

  window.location.href = "/meta.html";
};

</script>

</body>
</html>
