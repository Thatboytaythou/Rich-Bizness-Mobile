<script type="module">
import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* =========================
   SUPABASE
========================= */
const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

/* NAV */
window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/settings.html";
window.goNotifications = () => location.href="/notifications.html";

/* ROUTES */
const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/gallery.html",
  "/podcast.html",
  "/store.html",
  "/messages.html"
];

/* =========================
   THREE ENGINE
========================= */

const scene = new THREE.Scene();

/* 🔥 CAMERA (FIXED PERFECTLY FOR MOBILE) */
const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

/* 👇 THIS IS THE REAL FIX */
camera.position.set(0, 0.15, 7); // smooth + centered + not stretched

/* RENDERER */
const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const light = new THREE.PointLight(0x00ffcc, 2.5);
light.position.set(4, 4, 4);
scene.add(light);

/* CORE (SMALL + CLEAN) */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.4, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0x00ffcc,
    emissive: 0x00ffcc,
    emissiveIntensity: 2
  })
);

scene.add(core);

/* RING SETTINGS */
const items = [];
const radius = 2.2;        // 🔥 smaller = better mobile fit
const count = 10;
const step = (Math.PI * 2) / count;

/* 🔥 FINAL CENTER BALANCE */
const yOffset = -0.1;

for (let i = 0; i < count; i++) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 16, 16),
    new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x00ffcc,
      emissiveIntensity: 1
    })
  );

  mesh.userData.index = i;
  scene.add(mesh);
  items.push(mesh);
}

/* MOTION */
let velocity = 0;
let rotation = 0;
let dragging = false;

function animate() {
  requestAnimationFrame(animate);

  rotation += velocity;

  if (!dragging) {
    velocity *= 0.92;

    if (Math.abs(velocity) < 0.001) {
      velocity = 0;
      rotation = Math.round(rotation / step) * step;
    }
  }

  let active = 0;
  let best = -Infinity;

  items.forEach((m, i) => {
    const angle = i * step + rotation;

    /* 🔥 PERFECT ORBIT */
    m.position.x = Math.cos(angle) * radius;
    m.position.y = Math.sin(angle) * 0.55 + yOffset; // 🔥 FIX TOP BALANCE
    m.position.z = Math.sin(angle) * radius;

    const depth = (m.position.z + radius) / (radius * 2);

    /* 🔥 SMOOTH SIZE */
    const scale = 0.5 + depth * 0.35;
    m.scale.set(scale, scale, scale);

    m.material.emissiveIntensity = 0.5 + depth * 1;

    if (m.position.z > best) {
      best = m.position.z;
      active = i;
    }
  });

  window.activeIndex = active;

  core.rotation.y += 0.01;

  renderer.render(scene, camera);
}
animate();

/* CONTROLS */
let lastX = 0;

window.addEventListener("touchstart", e => {
  dragging = true;
  lastX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e => {
  const dx = e.touches[0].clientX - lastX;
  velocity = dx * 0.002;
  lastX = e.touches[0].clientX;
});

window.addEventListener("touchend", () => {
  dragging = false;
});

/* CLICK */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", e => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hit = raycaster.intersectObjects(items);

  if (hit.length) {
    location.href = ROUTES[hit[0].object.userData.index];
  }
});

/* ENTER */
window.enter = () => {
  if (!window.user) {
    location.href = "/auth.html";
    return;
  }
  location.href = ROUTES[window.activeIndex];
};

/* RESIZE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
