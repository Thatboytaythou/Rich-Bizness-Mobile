<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI METAL CORE</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}

canvas{
  position:fixed;
  inset:0;
}

/* UI */
.topbar{
  position:fixed;
  top:15px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 16px;
  z-index:10;
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ffcc;
}

/* BUTTON */
.enter{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  background:#00ffcc;
  color:#000;
  padding:14px 30px;
  border-radius:30px;
  font-weight:bold;
}

/* STATS */
.stats{
  position:fixed;
  bottom:0;
  width:100%;
  padding:12px;
  background:rgba(0,0,0,.8);
  display:flex;
  justify-content:space-around;
  color:#00ffcc;
  z-index:10;
}
</style>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";

/* ROUTES */
const ROUTES = [
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/store.html",
  "/meta.html",
  "/sports.html",
  "/upload.html",
  "/gallery.html"
];

const labels = ["LIVE","MUSIC","GAMING","STORE","META","SPORTS","UPLOAD","GALLERY"];

/* SCENE */
const scene = new THREE.Scene();

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z = 7;

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.PointLight(0x00ffcc,3);
light.position.set(5,5,5);
scene.add(light);

/* CORE */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.7,32,32),
  new THREE.MeshStandardMaterial({
    color:0x00ffcc,
    emissive:0x00ffcc,
    emissiveIntensity:2
  })
);
scene.add(core);

/* METAL RING BASE */
const baseRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.6,0.2,30,100),
  new THREE.MeshStandardMaterial({
    color:0x222222,
    metalness:1,
    roughness:0.3
  })
);
scene.add(baseRing);

/* SEGMENTS */
const panels = [];
const radius = 2.2;
const step = (Math.PI*2)/labels.length;

function createPanel(label){
  const geo = new THREE.BoxGeometry(0.9,0.5,0.2);

  const mat = new THREE.MeshStandardMaterial({
    color:0x111111,
    metalness:1,
    roughness:0.4,
    emissive:0x00ffcc,
    emissiveIntensity:0.2
  });

  const mesh = new THREE.Mesh(geo,mat);

  // TEXT
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 256;
  canvas.height = 128;

  ctx.fillStyle="#00ffcc";
  ctx.font="bold 40px sans-serif";
  ctx.textAlign="center";
  ctx.fillText(label,128,70);

  const tex = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({map:tex,transparent:true})
  );

  sprite.scale.set(1.2,0.6,1);
  mesh.add(sprite);
  sprite.position.z = 0.3;

  return mesh;
}

for(let i=0;i<labels.length;i++){
  const p = createPanel(labels[i]);
  scene.add(p);
  panels.push(p);
}

/* MOTION */
let rotation = 0;
let velocity = 0;
let dragging = false;
let active = 0;

/* ANIMATE */
function animate(){
  requestAnimationFrame(animate);

  rotation += velocity;

  if(!dragging){
    velocity *= 0.9;

    if(Math.abs(velocity)<0.001){
      velocity=0;
      rotation=Math.round(rotation/step)*step;
      navigator.vibrate?.(10);
    }
  }

  let best=-Infinity;

  panels.forEach((p,i)=>{
    const angle = i*step + rotation;

    const x = Math.cos(angle)*radius;
    const y = Math.sin(angle)*radius*0.4;
    const z = Math.sin(angle)*radius;

    p.position.set(x,y,z);
    p.lookAt(0,0,0);

    const depth = (z+radius)/(radius*2);

    p.scale.setScalar(0.8 + depth*0.4);

    /* 🔥 ACTIVE GLOW */
    if(z > best){
      best = z;
      active = i;
    }

    p.material.emissiveIntensity = (i === active) ? 1.8 : 0.2;
  });

  core.rotation.y += 0.01;
  baseRing.rotation.z += velocity*0.5;

  renderer.render(scene,camera);
}
animate();

/* TOUCH */
let lastX=0;

addEventListener("touchstart",e=>{
  dragging=true;
  lastX=e.touches[0].clientX;
});

addEventListener("touchmove",e=>{
  const dx=e.touches[0].clientX-lastX;
  velocity=dx*0.003;
  lastX=e.touches[0].clientX;
});

addEventListener("touchend",()=>dragging=false);

/* CLICK ZOOM */
addEventListener("click",()=>{
  const target = panels[active];

  // zoom animation
  const startZ = camera.position.z;
  let t = 0;

  function zoom(){
    t += 0.05;
    camera.position.z = startZ - t*3;

    if(t < 1){
      requestAnimationFrame(zoom);
    } else {
      location.href = ROUTES[active];
    }
  }

  zoom();
});

/* BUTTON */
window.enter=()=>{
  location.href = ROUTES[active];
};

/* RESIZE */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</head>

<body>

<div class="topbar">
  <div class="icon">👤</div>
  <div style="display:flex;gap:10px;">
    <div class="icon">🔔</div>
    <div class="icon">⚙️</div>
  </div>
</div>

<div class="enter" onclick="enter()">ACTIVATE</div>

<div class="stats">
  <div>$10,890</div>
  <div>28,450 pts</div>
  <div>LEGEND</div>
  <div>1,245 online</div>
</div>

</body>
</html>
