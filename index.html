<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI</title>
<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/settings.html";
window.goNotifications = () => location.href="/notifications.html";
</script>
</head>

<body>

<div class="bg"></div>

<!-- 🔥 TOP BAR -->
<div class="topbar">

  <!-- LEFT -->
  <div class="icon left" onclick="goProfile()">👤</div>

  <!-- RIGHT -->
  <div class="right-icons">
    <div class="icon" onclick="goNotifications()">🔔</div>
    <div class="icon" onclick="goSettings()">⚙️</div>
  </div>

</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>

/* =========================
   🔥 10 SECTIONS (UPDATED)
========================= */

const ITEMS = [
  "🌐","📡","🎵","🎮","🏆",
  "🛒","🖼️","🎙️","🛒","💬"
];

const LABELS = [
  "META","LIVE","MUSIC","GAMING","SPORTS",
  "STORE","GALLERY","PODCAST","STORE","MESSAGES"
];

const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/gallery.html",
  "/podcast.html",
  "/store.html", // 🔥 replaced PROFILE slot
  "/messages.html"
];

const wheel = document.getElementById("wheel");
const screen = document.getElementById("screen");
const enterBtn = document.getElementById("enterBtn");

/* =========================
   PHYSICS ENGINE
========================= */

let rot = 0;
let vel = 0;
let isTouching = false;

const step = (Math.PI * 2) / ITEMS.length;
const radius = 130;

/* =========================
   BUILD WHEEL
========================= */

ITEMS.forEach((icon,i)=>{
  const el = document.createElement("div");
  el.className = "seg";
  el.innerText = icon;

  const angle = i * step - Math.PI/2;

  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  el.style.transform = `
    translate(-50%,-50%)
    translate(${x}px, ${y}px)
  `;

  el.onclick = () => {
    window.location.href = ROUTES[i];
  };

  wheel.appendChild(el);
});

/* =========================
   UPDATE
========================= */

function update(){
  wheel.style.transform = `rotate(${rot}rad)`;

  let index = Math.round(-rot / step) % ITEMS.length;
  if(index < 0) index += ITEMS.length;

  document.querySelectorAll(".seg").forEach((el,i)=>{
    el.classList.toggle("active", i === index);
  });

  screen.innerText = LABELS[index];

  return index;
}

/* =========================
   LOOP
========================= */

function loop(){
  rot += vel;
  vel *= 0.94;

  if(!isTouching && Math.abs(vel) < 0.002){
    const snap = Math.round(rot / step) * step;
    rot += (snap - rot) * 0.15;
  }

  update();
  requestAnimationFrame(loop);
}
loop();

/* =========================
   TOUCH
========================= */

let startX = 0;
let lastX = 0;

window.addEventListener("touchstart", e=>{
  isTouching = true;
  startX = e.touches[0].clientX;
  lastX = startX;
});

window.addEventListener("touchmove", e=>{
  const x = e.touches[0].clientX;
  const dx = x - lastX;

  vel = dx * 0.002;
  lastX = x;
});

window.addEventListener("touchend", ()=>{
  isTouching = false;
});

/* =========================
   ENTER
========================= */

enterBtn.onclick = ()=>{
  if(!window.user){
    window.location.href="/auth.html";
    return;
  }

  const index = update();
  window.location.href = ROUTES[index];
};

</script>

</body>
</html>
