<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI METAL CORE</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:sans-serif;
}

/* CANVAS */
canvas{
  position:fixed;
  inset:0;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:15px;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 16px;
  z-index:10;
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ffcc;
}

/* CENTER */
.center-ui{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  text-align:center;
  color:#00ffcc;
  pointer-events:none;
}

.center-ui h1{
  color:#000;
  background:#00ffcc;
  padding:12px 20px;
  border-radius:50px;
}

/* BUTTON */
.enter{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;

  background:#00ffcc;
  color:#000;
  padding:14px 30px;
  border-radius:30px;
  font-weight:bold;
}

/* STATS */
.stats{
  position:fixed;
  bottom:0;
  width:100%;
  padding:12px;
  background:rgba(0,0,0,.8);
  display:flex;
  justify-content:space-around;
  color:#00ffcc;
  z-index:10;
}
</style>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.158.0/build/three.module.js";

/* ROUTES */
const ROUTES = [
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/store.html",
  "/meta.html",
  "/sports.html",
  "/upload.html",
  "/gallery.html"
];

/* SCENE */
const scene = new THREE.Scene();

/* CAMERA */
const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z = 7;

/* RENDER */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* LIGHT */
scene.add(new THREE.AmbientLight(0xffffff,1.2));
const light = new THREE.PointLight(0x00ffcc,3);
light.position.set(5,5,5);
scene.add(light);

/* CORE PORTAL */
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.6,32,32),
  new THREE.MeshStandardMaterial({
    color:0x00ffcc,
    emissive:0x00ffcc,
    emissiveIntensity:2
  })
);
scene.add(core);

/* METAL RING */
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(2.6,0.15,30,100),
  new THREE.MeshStandardMaterial({
    color:0x333333,
    metalness:1,
    roughness:.3
  })
);
scene.add(ring);

/* INNER LIGHT RING */
const glowRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.2,0.05,30,100),
  new THREE.MeshStandardMaterial({
    color:0x00ffcc,
    emissive:0x00ffcc,
    emissiveIntensity:2
  })
);
scene.add(glowRing);

/* NODES */
const items = [];
const labels = ["LIVE","MUSIC","GAMING","STORE","META","SPORTS","UPLOAD","GALLERY"];

const radius = 2.2;
const step = (Math.PI*2)/labels.length;

let rotation = 0;
let velocity = 0;
let dragging = false;
let active = 0;

/* CREATE NODES */
for(let i=0;i<labels.length;i++){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.18,16,16),
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      emissive:0x00ffcc,
      emissiveIntensity:1
    })
  );
  mesh.userData.index = i;
  scene.add(mesh);
  items.push(mesh);
}

/* TEXT SPRITES */
function createLabel(text){
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 256;
  canvas.height = 128;

  ctx.fillStyle="#00ffcc";
  ctx.font="bold 40px sans-serif";
  ctx.textAlign="center";
  ctx.fillText(text,128,64);

  const tex = new THREE.CanvasTexture(canvas);

  return new THREE.Sprite(
    new THREE.SpriteMaterial({map:tex,transparent:true})
  );
}

const textSprites = labels.map(t=>{
  const s = createLabel(t);
  scene.add(s);
  return s;
});

/* ANIMATE */
function animate(){
  requestAnimationFrame(animate);

  rotation += velocity;

  if(!dragging){
    velocity *= 0.9;

    if(Math.abs(velocity)<0.001){
      velocity=0;
      rotation=Math.round(rotation/step)*step;

      navigator.vibrate?.(10);
    }
  }

  let best=-Infinity;

  items.forEach((m,i)=>{
    const angle = i*step + rotation;

    const x = Math.cos(angle)*radius;
    const y = Math.sin(angle)*radius*0.4;
    const z = Math.sin(angle)*radius;

    m.position.set(x,y,z);

    textSprites[i].position.set(x,y+0.5,z);

    const depth = (z+radius)/(radius*2);
    const scale = 0.5 + depth*.4;

    m.scale.set(scale,scale,scale);

    if(z>best){
      best=z;
      active=i;
    }
  });

  core.rotation.y += .01;
  ring.rotation.z += velocity*0.5;
  glowRing.rotation.z += velocity*0.5;

  renderer.render(scene,camera);
}
animate();

/* TOUCH */
let lastX=0;

addEventListener("touchstart",e=>{
  dragging=true;
  lastX=e.touches[0].clientX;
});

addEventListener("touchmove",e=>{
  const dx=e.touches[0].clientX-lastX;
  velocity=dx*0.003;
  lastX=e.touches[0].clientX;
});

addEventListener("touchend",()=>dragging=false);

/* CLICK */
addEventListener("click",()=>{
  location.href = ROUTES[active];
});

/* BUTTON */
window.enter=()=>{
  location.href = ROUTES[active];
};

/* RESIZE */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</head>

<body>

<div class="topbar">
  <div class="icon">👤</div>
  <div style="display:flex;gap:10px;">
    <div class="icon">🔔</div>
    <div class="icon">⚙️</div>
  </div>
</div>

<div class="center-ui">
  <h1>RICH BIZNESS</h1>
</div>

<div class="enter" onclick="enter()">ACTIVATE</div>

<div class="stats">
  <div>$10,890</div>
  <div>28,450 pts</div>
  <div>LEGEND</div>
  <div>1,245 online</div>
</div>

</body>
</html>
