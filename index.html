<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI 3D</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000;
}

canvas{
  display:block;
}

/* TOP BAR */
.topbar{
  position:absolute;
  top:10px;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 15px;
  z-index:10;
}

.icon{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#00ffcc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.right-icons{
  display:flex;
  gap:10px;
}

/* ENTER BUTTON */
.enter{
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  background:#00ffcc;
  color:#000;
  padding:15px 30px;
  border-radius:30px;
  font-weight:bold;
  z-index:10;
}
</style>

<script type="module">
import * as THREE from "https://cdn.skypack.dev/three@0.158.0";

/* =========================
   SUPABASE
========================= */
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
window.user = data?.session?.user || null;

window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/settings.html";
window.goNotifications = () => location.href="/notifications.html";

/* =========================
   ROUTES
========================= */

const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/gallery.html",
  "/podcast.html",
  "/store.html",
  "/messages.html"
];

/* =========================
   THREE SETUP
========================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHT
========================= */

const light = new THREE.PointLight(0x00ffcc, 2);
light.position.set(5,5,5);
scene.add(light);

/* =========================
   CORE (CENTER)
========================= */

const coreGeo = new THREE.SphereGeometry(1,32,32);
const coreMat = new THREE.MeshStandardMaterial({
  color:0x00ffcc,
  emissive:0x00ffcc,
  emissiveIntensity:0.8
});

const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

/* =========================
   RING ITEMS
========================= */

const items = [];
const radius = 3;
const count = 10;

for(let i=0;i<count;i++){
  const geo = new THREE.SphereGeometry(0.25,16,16);
  const mat = new THREE.MeshStandardMaterial({
    color:0xffffff,
    emissive:0x00ffcc,
    emissiveIntensity:0.3
  });

  const mesh = new THREE.Mesh(geo, mat);

  const angle = (i/count) * Math.PI * 2;

  mesh.position.x = Math.cos(angle) * radius;
  mesh.position.y = Math.sin(angle) * radius;

  mesh.userData.index = i;

  scene.add(mesh);
  items.push(mesh);
}

/* =========================
   ROTATION
========================= */

let velocity = 0;
let rotation = 0;

function animate(){
  requestAnimationFrame(animate);

  rotation += velocity;
  velocity *= 0.95;

  items.forEach((m,i)=>{
    const angle = (i/count)*Math.PI*2 + rotation;

    m.position.x = Math.cos(angle)*radius;
    m.position.y = Math.sin(angle)*radius;
  });

  core.rotation.y += 0.01;

  renderer.render(scene,camera);
}
animate();

/* =========================
   TOUCH CONTROL
========================= */

let startX = 0;

window.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

window.addEventListener("touchmove", e=>{
  const dx = e.touches[0].clientX - startX;
  velocity = dx * 0.0005;
});

/* =========================
   CLICK DETECT (RAYCAST)
========================= */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event)=>{
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(items);

  if(intersects.length > 0){
    const i = intersects[0].object.userData.index;
    location.href = ROUTES[i];
  }
});

/* =========================
   ENTER BUTTON
========================= */

window.enter = ()=>{
  if(!window.user){
    location.href="/auth.html";
    return;
  }

  // pick closest front item
  let closest = 0;
  let best = -Infinity;

  items.forEach((m,i)=>{
    if(m.position.y > best){
      best = m.position.y;
      closest = i;
    }
  });

  location.href = ROUTES[closest];
};

</script>
</head>

<body>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="right-icons">
    <div class="icon" onclick="goNotifications()">🔔</div>
    <div class="icon" onclick="goSettings()">⚙️</div>
  </div>
</div>

<div class="enter" onclick="enter()">ACTIVATE</div>

</body>
</html>
