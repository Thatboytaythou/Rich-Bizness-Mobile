<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI LOCKED</title>

<link rel="stylesheet" href="/styles/main.css">

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
}

/* BG */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(0,255,200,.15), transparent 60%),
    url("/images/background-v2.png") center/cover no-repeat;
}

/* 🔥 HARD CENTER (NO FLEX, NO SHIFT) */
.app{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
}

/* WHEEL */
.omni{
  width:320px;        /* 🔥 LOCKED SIZE */
  height:320px;
  position:relative;
}

/* RING */
.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:#001;
  box-shadow:
    0 0 100px #00ffcc,
    inset 0 0 60px rgba(0,255,200,.3);
}

/* WHEEL ROTATION */
.wheel{
  position:absolute;
  inset:0;
}

/* ICONS */
.seg{
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:center;
  font-size:22px;
  opacity:.6;
}

/* ACTIVE */
.seg.active{
  transform:translate(-50%,-50%) scale(1.5);
  opacity:1;
  filter:drop-shadow(0 0 15px #00ffff);
}

/* CORE */
.core{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:120px;
  height:120px;
  border-radius:50%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ffcc;
  font-weight:bold;
  box-shadow:0 0 40px #00ffcc;
  cursor:pointer;
}

/* LABEL */
.screen{
  position:fixed;
  bottom:60px;
  width:100%;
  text-align:center;
  font-size:24px;
  color:#00ffcc;
}

/* TOPBAR (kept simple so it doesn’t shift layout) */
.topbar{
  position:fixed;
  top:15px;
  right:15px;
  display:flex;
  gap:12px;
  z-index:100;
}
.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,255,200,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ffcc;
  font-size:18px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 10px rgba(0,255,200,.3);
  cursor:pointer;
}
</style>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

// minimal auth check (NO layout impact)
const { data: { user } } = await supabase.auth.getUser();
window.currentUser = user || null;

// nav
window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/setting.html";
</script>

</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>
/* DATA */
const ITEMS = ["🌐","📡","🎵","🎮","🏆","🛒","⬆️","👤","💬","🔔"];
const LABELS = ["META","LIVE","MUSIC","GAMING","SPORTS","STORE","UPLOAD","PROFILE","MESSAGES","ALERTS"];
const ROUTES = [
  "/meta.html",
  "/live.html",
  "/music.html",
  "/gaming.html",
  "/sports.html",
  "/store.html",
  "/upload.html",
  "/profile.html",
  "/messages.html",
  "/notifications.html"
];

const wheel = document.getElementById("wheel");
const screen = document.getElementById("screen");
const enterBtn = document.getElementById("enterBtn");

let rot = 0;
let vel = 0;

const step = (Math.PI*2)/ITEMS.length;
/* 🔥 FIXED RADIUS (NO VIEWPORT DEPENDENCY) */
const radius = 110;

/* BUILD */
ITEMS.forEach((icon,i)=>{
  const el = document.createElement("div");
  el.className = "seg";
  el.innerText = icon;

  const angle = i * step - Math.PI/2;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  el.style.transform = `
    translate(-50%,-50%)
    translate(${x}px, ${y}px)
  `;

  el.onclick = () => {
    // tap icon goes directly
    window.location.href = ROUTES[i];
  };

  wheel.appendChild(el);
});

/* UPDATE */
function update(){
  wheel.style.transform = `rotate(${rot}rad)`;

  let index = Math.round(-rot/step)%ITEMS.length;
  if(index<0) index+=ITEMS.length;

  document.querySelectorAll(".seg").forEach((s,i)=>{
    s.classList.toggle("active", i===index);
  });

  screen.innerText = LABELS[index];
  return index;
}

/* LOOP */
function loop(){
  rot += vel;
  vel *= 0.92;

  if(Math.abs(vel)<0.002){
    const snap = Math.round(rot/step)*step;
    rot += (snap-rot)*0.12;
  }

  update();
  requestAnimationFrame(loop);
}
loop();

/* TOUCH */
let startX=0;
window.addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});
window.addEventListener("touchmove", e=>{
  let dx = e.touches[0].clientX - startX;
  vel = dx * 0.0004;
});

/* ENTER */
enterBtn.onclick = ()=>{
  if(!window.currentUser){
    window.location.href = "/auth.html";
    return;
  }
  const index = update();
  window.location.href = ROUTES[index];
};
</script>

</body>
</html>
