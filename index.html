<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RB OMNI</title>

<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data: { user } } = await supabase.auth.getUser();
window.currentUser = user || null;

window.goProfile = () => location.href="/profile.html";
window.goSettings = () => location.href="/setting.html";
</script>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="app">
  <div class="omni">
    <div class="ring"></div>
    <div class="wheel" id="wheel"></div>
    <div class="core" id="enterBtn">ENTER</div>
  </div>
</div>

<div class="screen" id="screen">META</div>

<script>
const ITEMS = ["🌐","📡","🎵","🎮","🏆","🛒","⬆️","👤","💬","🔔"];
const LABELS = ["META","LIVE","MUSIC","GAMING","SPORTS","STORE","UPLOAD","PROFILE","MESSAGES","ALERTS"];
const ROUTES = [
  "/meta.html","/live.html","/music.html","/gaming.html","/sports.html",
  "/store.html","/upload.html","/profile.html","/messages.html","/notifications.html"
];

const wheel = document.getElementById("wheel");
const screen = document.getElementById("screen");
const enterBtn = document.getElementById("enterBtn");

let rot = 0, vel = 0;
const step = (Math.PI*2)/ITEMS.length;
const radius = 110;

/* BUILD */
ITEMS.forEach((icon,i)=>{
  const el = document.createElement("div");
  el.className = "seg";
  el.innerText = icon;

  const angle = i * step - Math.PI/2;
  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  el.style.transform = `translate(-50%,-50%) translate(${x}px, ${y}px)`;

  el.onclick = ()=> window.location.href = ROUTES[i];
  wheel.appendChild(el);
});

/* UPDATE */
function update(){
  wheel.style.transform = `rotate(${rot}rad)`;

  let index = Math.round(-rot/step)%ITEMS.length;
  if(index<0) index+=ITEMS.length;

  document.querySelectorAll(".seg").forEach((s,i)=>{
    s.classList.toggle("active", i===index);
  });

  screen.innerText = LABELS[index];
  return index;
}

/* LOOP */
function loop(){
  rot += vel;
  vel *= 0.92;

  if(Math.abs(vel)<0.002){
    const snap = Math.round(rot/step)*step;
    rot += (snap-rot)*0.12;
  }

  update();
  requestAnimationFrame(loop);
}
loop();

/* TOUCH */
let startX=0;
window.addEventListener("touchstart", e=> startX = e.touches[0].clientX);
window.addEventListener("touchmove", e=>{
  let dx = e.touches[0].clientX - startX;
  vel = dx * 0.0004;
});

/* ENTER */
enterBtn.onclick = ()=>{
  if(!window.currentUser){
    location.href="/auth.html";
    return;
  }
  const i = update();
  location.href = ROUTES[i];
};
</script>

</body>
</html>
