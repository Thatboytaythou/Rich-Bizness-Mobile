<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE</title>

<link rel="stylesheet" href="/styles/main.css">
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div id="userEmail" style="font-size:12px;opacity:.7;"></div>
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="container">

  <h1>LIVE</h1>

  <button class="main-btn">GO LIVE 🔴</button>
  <br>

  <button class="secondary-btn" onclick="goBack()">GO BACK</button>

</div>

<script>

// 🔐 USER CHECK
const user = JSON.parse(localStorage.getItem("rb_user"));

if(!user){
  window.location.href = "/auth.html";
}

// 👤 SHOW USER
document.getElementById("userEmail").innerText = user.email;

// NAV
function goBack(){ window.location.href = "/"; }
function goProfile(){ window.location.href = "/profile.html"; }
function goSettings(){ window.location.href = "/setting.html"; }

</script>

</body>
</html>
