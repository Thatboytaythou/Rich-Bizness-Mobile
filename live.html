<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE</title>

<link rel="stylesheet" href="/styles/main.css">

<style>

/* CAMERA BOX */
.video-box{
  margin-top:20px;
  width:260px;
  height:160px;
  border-radius:12px;
  overflow:hidden;
  background:black;
  box-shadow:0 0 20px rgba(0,255,200,.3);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CHAT */
.chat-box{
  margin-top:20px;
  width:260px;
  height:120px;
  overflow:hidden;
  border-radius:10px;
  background:rgba(0,0,0,.6);
  padding:10px;
  font-size:12px;
  text-align:left;
}

.chat-line{
  opacity:.8;
  margin-bottom:4px;
}

</style>
</head>

<body>

<div class="bg"></div>

<!-- TOPBAR -->
<div class="topbar">
  <div id="userEmail" style="font-size:12px;"></div>
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="container">

  <h1>LIVE</h1>

  <div id="statusText">OFFLINE</div>
  <div id="viewerCount">0 watching</div>

  <button class="main-btn" onclick="toggleLive()" id="liveBtn">
    GO LIVE 🔴
  </button>

  <!-- 🎥 CAMERA -->
  <div class="video-box">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <!-- 💬 CHAT -->
  <div class="chat-box" id="chatBox"></div>

  <br>

  <button class="secondary-btn" onclick="goBack()">GO BACK</button>

</div>

<script>

/* USER */
const user = JSON.parse(localStorage.getItem("rb_user"));

if(!user){
  window.location.href = "/auth.html";
}

document.getElementById("userEmail").innerText = user.email;


/* LIVE STATE */
let isLive = false;
let viewers = 0;
let chatBox = document.getElementById("chatBox");
let video = document.getElementById("video");
let stream = null;

/* TOGGLE LIVE */
async function toggleLive(){

  isLive = !isLive;

  if(isLive){

    document.getElementById("statusText").innerText = "LIVE 🔴";
    document.getElementById("liveBtn").innerText = "END STREAM ⛔";

    startViewers();
    startCamera();

  } else {

    document.getElementById("statusText").innerText = "OFFLINE";
    document.getElementById("liveBtn").innerText = "GO LIVE 🔴";

    viewers = 0;
    updateViewers();

    stopCamera();
  }
}


/* CAMERA */
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
  }catch(err){
    alert("Camera access denied");
  }
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
}


/* VIEWERS */
function updateViewers(){
  document.getElementById("viewerCount").innerText = viewers + " watching";
}

function startViewers(){
  setInterval(()=>{
    if(!isLive) return;

    viewers += Math.floor(Math.random()*3);
    updateViewers();

  },2000);
}


/* CHAT */
const messages = [
  "🔥 this fire",
  "yo this crazy",
  "we lit",
  "drop more",
  "W stream",
  "nah this hard",
  "TURN UP",
  "😂😂😂"
];

function spawnChat(){
  if(!isLive) return;

  const msg = document.createElement("div");
  msg.className = "chat-line";
  msg.innerText =
    "user" + Math.floor(Math.random()*100) +
    ": " +
    messages[Math.floor(Math.random()*messages.length)];

  chatBox.appendChild(msg);

  if(chatBox.children.length > 8){
    chatBox.removeChild(chatBox.firstChild);
  }
}

setInterval(spawnChat,1500);


/* NAV */
function goBack(){ window.location.href = "/"; }
function goProfile(){ window.location.href = "/profile.html"; }
function goSettings(){ window.location.href = "/setting.html"; }

</script>

</body>
</html>
