<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE</title>

<script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>
<link rel="stylesheet" href="/styles/main.css">
</head>

<body>

<div class="container">

<h1>LIVE</h1>
<div class="status" id="status">OFFLINE</div>

<button class="main-btn" id="liveBtn">GO LIVE 🔴</button>

<video id="video" autoplay muted playsinline></video>

<button class="secondary-btn" onclick="location.href='/'">GO BACK</button>

</div>

<script>

/* USER */
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;
  return JSON.parse(raw);
}

let room = null;
let isLive = false;

const videoEl = document.getElementById("video");
const statusEl = document.getElementById("status");
const btn = document.getElementById("liveBtn");

async function getToken(username){
  const res = await fetch(`/api/livekit-token?room=richbiz&username=${username}`);
  const data = await res.json();
  if(!data.token) throw new Error("No token");
  return data.token;
}

btn.onclick = async () => {

  if(!isLive){

    const user = getUser();
    if(!user){
      location.href="/auth.html";
      return;
    }

    try {
      const token = await getToken(user.username);

      room = new LivekitClient.Room();

      await room.connect(
        "wss://rich-bizness-mobile-zvq5cojk.livekit.cloud",
        token
      );

      const tracks = await LivekitClient.createLocalTracks({
        audio:true,
        video:true
      });

      const videoTrack = tracks.find(t=>t.kind==="video");
      videoTrack.attach(videoEl);

      for(const t of tracks){
        await room.localParticipant.publishTrack(t);
      }

      statusEl.innerText="LIVE 🔴";
      btn.innerText="END STREAM ⛔";
      isLive=true;

    } catch(err){
      console.error(err);
      alert("Stream failed");
    }

  } else {
    room.disconnect();
    videoEl.srcObject=null;

    statusEl.innerText="OFFLINE";
    btn.innerText="GO LIVE 🔴";
    isLive=false;
  }

};

</script>

</body>
</html>
