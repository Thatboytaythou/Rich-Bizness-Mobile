<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE</title>

<!-- ✅ FIXED CDN (your error was HERE) -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<link rel="stylesheet" href="/styles/main.css">
</head>

<body>

<div class="container">

<h1>LIVE</h1>
<div class="status" id="status">OFFLINE</div>

<button class="main-btn" id="liveBtn">GO LIVE 🔴</button>

<video id="video" autoplay muted playsinline></video>

<button class="secondary-btn" onclick="location.href='/'">GO BACK</button>

</div>

<script>

/* =========================
   MAKE SURE LIVEKIT LOADED
========================= */
if (typeof LivekitClient === "undefined") {
  alert("LiveKit failed to load. Refresh the page.");
  throw new Error("LivekitClient not found");
}

/* =========================
   USER FIX
========================= */
function getUsername(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return "guest";

  try {
    const user = JSON.parse(raw);
    return (user.email || "guest").replace(/[^a-zA-Z0-9_-]/g,"");
  } catch {
    return "guest";
  }
}

/* =========================
   STATE
========================= */
let room = null;
let isLive = false;

const videoEl = document.getElementById("video");
const statusEl = document.getElementById("status");
const btn = document.getElementById("liveBtn");

/* =========================
   GET TOKEN
========================= */
async function getToken(username){
  const res = await fetch(`/api/livekit-token?room=richbiz&username=${username}`);
  const data = await res.json();

  if(!data.token){
    throw new Error("Token missing from API");
  }

  return data.token;
}

/* =========================
   GO LIVE
========================= */
btn.onclick = async () => {

  if(!isLive){

    try {

      const username = getUsername();

      // 🔥 GET TOKEN
      const token = await getToken(username);

      // 🔥 CREATE ROOM
      room = new LivekitClient.Room();

      // 🔥 CONNECT
      await room.connect(
        "wss://rich-bizness-mobile-zvq5cojk.livekit.cloud",
        token
      );

      // 🔥 CAMERA (mobile safe)
      const stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
      });

      videoEl.srcObject = stream;

      // 🔥 FIXED TRACK PUBLISH
      for (const track of stream.getTracks()) {

        if(track.kind === "video"){
          await room.localParticipant.publishTrack(
            new LivekitClient.LocalVideoTrack(track)
          );
        }

        if(track.kind === "audio"){
          await room.localParticipant.publishTrack(
            new LivekitClient.LocalAudioTrack(track)
          );
        }
      }

      statusEl.innerText = "LIVE 🔴";
      btn.innerText = "END STREAM ⛔";
      isLive = true;

    } catch(err){

      console.error("LIVE ERROR:", err);
      alert("Stream failed: " + err.message);

    }

  } else {

    if(room){
      room.disconnect();
      room = null;
    }

    videoEl.srcObject = null;

    statusEl.innerText = "OFFLINE";
    btn.innerText = "GO LIVE 🔴";
    isLive = false;
  }

};

</script>

</body>
</html>
