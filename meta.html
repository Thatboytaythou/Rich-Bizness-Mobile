<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>META</title>

<link rel="stylesheet" href="/styles/main.css">
</head>

<body>

<!-- 🔥 BACKGROUND -->
<div class="bg"></div>

<!-- 🔥 TOP BAR -->
<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<!-- 🔥 CONTENT -->
<div class="container">

  <h1>META</h1>

  <button class="main-btn" onclick="enterMeta()">
    ENTER META 🌐
  </button>

  <button class="secondary-btn" onclick="goBack()">
    GO BACK
  </button>

</div>

<script>

/* =========================
   USER CHECK
========================= */
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;

  try {
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

const user = getUser();

if(!user){
  location.href="/auth.html";
}

/* =========================
   META ACTION (🔥 REAL CONNECTION)
========================= */
function enterMeta(){

  // Example system entry
  // You can change this later to VR / dashboard / hub

  alert("Entering META SYSTEM...");

  // 🔥 redirect to core hub (change later)
  location.href = "/live.html";
}

/* =========================
   NAV
========================= */
function goBack(){
  location.href = "/";
}

function goProfile(){
  location.href = "/profile.html";
}

function goSettings(){
  location.href = "/setting.html";
}

</script>

</body>
</html>
