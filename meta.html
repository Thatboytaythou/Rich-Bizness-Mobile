<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>META</title>
<link rel="stylesheet" href="/styles/main.css">
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goProfile()">👤</div>
  <div class="icon" onclick="goSettings()">⚙️</div>
</div>

<div class="container">
  <h1>META</h1>

  <button class="main-btn">ENTER META 🌐</button>
  <button class="secondary-btn" onclick="goBack()">GO BACK</button>
</div>

<script>
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;
  return JSON.parse(raw);
}

if(!getUser()){
  location.href="/auth.html";
}

function goBack(){ location.href="/"; }
function goProfile(){ location.href="/profile.html"; }
function goSettings(){ location.href="/setting.html"; }
</script>

</body>
</html>
