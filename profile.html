<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFILE — RICH BIZNESS</title>

<link rel="stylesheet" href="/styles/main.css">

<style>

/* PROFILE CARD */
.profile-card{
  text-align:center;
  padding:30px 25px;
  border-radius:16px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(0,255,200,.25);
}

/* USER NAME */
.username{
  font-size:20px;
  margin-bottom:6px;
}

.email{
  font-size:13px;
  opacity:.6;
  margin-bottom:25px;
}

/* AVATAR */
.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#00ffcc;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  margin:0 auto 20px;
  box-shadow:0 0 20px #00ffcc;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goHome()">🏠</div>
  <div class="icon" onclick="logout()">🚪</div>
</div>

<div class="container">

  <div class="profile-card">

    <h1>PROFILE</h1>

    <div class="avatar" id="avatar">?</div>

    <div class="username" id="username">Loading...</div>
    <div class="email" id="email">Loading...</div>

    <button class="main-btn" onclick="logout()">
      LOG OUT ✌🏽
    </button>

    <button class="secondary-btn" onclick="goHome()">
      GO BACK
    </button>

  </div>

</div>

<script>

/* =========================
   GET USER
========================= */
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;

  try{
    return JSON.parse(raw);
  }catch{
    return null;
  }
}

/* =========================
   INIT
========================= */
const user = getUser();

if(!user){
  // 🔥 protect route
  window.location.href = "/auth.html";
}

/* =========================
   DISPLAY USER
========================= */
if(user){

  const username = user.username || "User";
  const email = user.email || "No Email";

  document.getElementById("username").innerText = username;
  document.getElementById("email").innerText = email;

  // 🔥 avatar letter
  document.getElementById("avatar").innerText =
    username.charAt(0).toUpperCase();
}

/* =========================
   ACTIONS
========================= */
function logout(){
  localStorage.removeItem("rb_user");
  window.location.href = "/auth.html";
}

function goHome(){
  window.location.href = "/";
}

</script>

</body>
</html>
