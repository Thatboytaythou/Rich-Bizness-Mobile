<!DOCTYPE html>
<html>
<head>
<title>PROFILE</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  color:#00ffcc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:sans-serif;
}

/* TITLE */
h1{
  font-size:32px;
  margin-bottom:10px;
}

/* USER NAME */
.user{
  font-size:14px;
  opacity:.7;
  margin-bottom:30px;
}

/* MAIN BUTTON */
.main-btn{
  padding:18px 40px;
  font-size:18px;
  font-weight:bold;
  background:#00ffcc;
  color:black;
  border:none;
  border-radius:12px;
  box-shadow:0 0 25px #00ffcc;
  margin-bottom:25px;
  cursor:pointer;
  transition:.2s;
}

.main-btn:active{
  transform:scale(.95);
}

/* SECOND BUTTON */
.secondary-btn{
  padding:14px 28px;
  font-size:14px;
  border:none;
  border-radius:10px;
  background:#111;
  color:#00ffcc;
  cursor:pointer;
  transition:.2s;
}

.secondary-btn:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<h1>PROFILE</h1>

<!-- 🔥 SHOW WHO LOGGED IN -->
<div class="user" id="userName">Loading...</div>

<!-- 🔥 LOGOUT -->
<button class="main-btn" onclick="logout()">
  I'M OUT ✌🏽
</button>

<button class="secondary-btn" onclick="goBack()">
  GO BACK
</button>

<script>

/* SHOW USER */
const user = localStorage.getItem("rb_user");

if(user){
  document.getElementById("userName").innerText = user;
}else{
  document.getElementById("userName").innerText = "Not logged in";
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("rb_user");
  window.location.href = "/auth.html";
}

/* BACK */
function goBack(){
  window.location.href = "/";
}

</script>

</body>
</html>
