<!DOCTYPE html>
<html>
<head>
<title>PROFILE</title>
</head>

<body style="background:black;color:#00ffcc;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;">

<h1>PROFILE</h1>

<!-- 🔥 LOGOUT BUTTON -->
<button onclick="logout()" style="padding:15px 25px;background:#00ffcc;color:black;border:none;border-radius:8px;font-weight:bold;">
  I'M OUT
</button>

<br><br>

<button onclick="goBack()" style="padding:10px 20px;">
  GO BACK
</button>

<script>
function logout(){
  localStorage.removeItem("rb_user");
  window.location.href = "/auth.html";
}

function goBack(){
  window.location.href = "/";
}
</script>

</body>
</html>
