<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFILE — RICH BIZNESS</title>

<link rel="stylesheet" href="/styles/main.css">

<style>

/* CARD */
.profile-card{
  text-align:center;
  padding:30px 25px;
  border-radius:16px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(0,255,200,.25);
}

/* AVATAR */
.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#00ffcc;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:bold;
  margin:0 auto 20px;
  box-shadow:0 0 20px #00ffcc;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TEXT */
.username{
  font-size:20px;
  margin-bottom:6px;
}

.email{
  font-size:13px;
  opacity:.6;
  margin-bottom:20px;
}

/* INPUT */
.input{
  padding:12px;
  width:220px;
  border-radius:10px;
  border:none;
  margin-bottom:12px;
  background:#111;
  color:#00ffcc;
  box-shadow:0 0 10px rgba(0,255,200,.3);
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goHome()">🏠</div>
  <div class="icon" onclick="logout()">🚪</div>
</div>

<div class="container">

  <div class="profile-card">

    <h1>PROFILE</h1>

    <!-- AVATAR -->
    <div class="avatar" id="avatar">?</div>

    <!-- DISPLAY -->
    <div class="username" id="username">Loading...</div>
    <div class="email" id="email">Loading...</div>

    <!-- EDIT -->
    <input class="input" id="editName" placeholder="Edit username">

    <input type="file" id="avatarUpload" accept="image/*">

    <button class="main-btn" onclick="saveProfile()">
      SAVE CHANGES 💾
    </button>

    <button class="secondary-btn" onclick="logout()">
      LOG OUT ✌🏽
    </button>

    <button class="secondary-btn" onclick="goHome()">
      GO BACK
    </button>

  </div>

</div>

<script>

/* =========================
   GET USER
========================= */
function getUser(){
  const raw = localStorage.getItem("rb_user");
  if(!raw) return null;

  try{
    return JSON.parse(raw);
  }catch{
    return null;
  }
}

/* =========================
   INIT
========================= */
let user = getUser();

if(!user){
  window.location.href = "/auth.html";
}

/* =========================
   RENDER
========================= */
function render(){

  document.getElementById("username").innerText = user.username;
  document.getElementById("email").innerText = user.email;

  const avatar = document.getElementById("avatar");

  if(user.avatar){
    avatar.innerHTML = `<img src="${user.avatar}" />`;
  }else{
    avatar.innerText = user.username.charAt(0).toUpperCase();
  }

}

render();

/* =========================
   SAVE PROFILE
========================= */
function saveProfile(){

  const newName = document.getElementById("editName").value.trim();

  if(newName){
    user.username = newName;
  }

  const fileInput = document.getElementById("avatarUpload");
  const file = fileInput.files[0];

  if(file){

    const reader = new FileReader();

    reader.onload = function(e){
      user.avatar = e.target.result;

      localStorage.setItem("rb_user", JSON.stringify(user));
      render();

      alert("Profile updated 🔥");
    };

    reader.readAsDataURL(file);

  }else{

    localStorage.setItem("rb_user", JSON.stringify(user));
    render();

    alert("Profile updated 🔥");
  }

}

/* =========================
   ACTIONS
========================= */
function logout(){
  localStorage.removeItem("rb_user");
  window.location.href = "/auth.html";
}

function goHome(){
  window.location.href = "/";
}

</script>

</body>
</html>
