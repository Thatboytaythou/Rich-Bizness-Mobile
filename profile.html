<!DOCTYPE html>
<html>
<head>
<title>PROFILE</title>

<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

let user = null;

async function loadProfile(){

  const { data: { user: u } } = await supabase.auth.getUser();

  if(!u){
    window.location.href = "/auth.html";
    return;
  }

  user = u;

  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", u.id)
    .single();

  document.getElementById("email").innerText = u.email;

  if(data){
    document.getElementById("username").innerText = data.username;
    document.getElementById("avatar").innerText =
      data.username?.charAt(0).toUpperCase() || "?";
  } else {
    document.getElementById("username").innerText = "No profile yet";
  }
}

window.logout = async () => {
  await supabase.auth.signOut();
  window.location.href = "/auth.html";
};

window.goHome = () => {
  window.location.href = "/";
};

loadProfile();
</script>

<style>
.profile-card{
  text-align:center;
  padding:30px;
  background:rgba(0,0,0,.6);
  border-radius:16px;
}
.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#00ffcc;
  color:black;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:30px;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="topbar">
  <div class="icon" onclick="goHome()">🏠</div>
  <div class="icon" onclick="logout()">🚪</div>
</div>

<div class="container">

  <div class="profile-card">

    <h1>PROFILE</h1>

    <div id="avatar" class="avatar">?</div>

    <h2 id="username">Loading...</h2>
    <p id="email">Loading...</p>

    <button class="main-btn" onclick="logout()">LOG OUT</button>

  </div>

</div>

</body>
</html>
