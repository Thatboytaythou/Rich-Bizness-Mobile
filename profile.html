<!DOCTYPE html>
<html>
<head>
<title>PROFILE</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:black;
  color:#00ffcc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:sans-serif;
}

/* TITLE */
h1{
  font-size:32px;
  margin-bottom:40px;
}

/* MAIN BUTTON */
.main-btn{
  padding:18px 40px;
  font-size:18px;
  font-weight:bold;
  background:#00ffcc;
  color:black;
  border:none;
  border-radius:10px;
  box-shadow:0 0 20px #00ffcc;
  margin-bottom:25px;
}

/* SECOND BUTTON */
.secondary-btn{
  padding:14px 28px;
  font-size:14px;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>PROFILE</h1>

<!-- 🔥 BIGGER + CLEAN -->
<button class="main-btn" onclick="logout()">
  I'M OUT ✌🏽
</button>

<button class="secondary-btn" onclick="goBack()">
  GO BACK
</button>

<script>
function logout(){
  localStorage.removeItem("rb_user");
  window.location.href = "/auth.html";
}

function goBack(){
  window.location.href = "/";
}
</script>

</body>
</html>
