<!DOCTYPE html>
<html>
<head>
<title>PROFILE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/styles/main.css">

<style>
.profile-card{
  text-align:center;
  padding:30px;
  background:rgba(0,0,0,.6);
  border-radius:16px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 25px rgba(0,255,200,.3);
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#00ffcc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:black;
  margin:auto;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="container">

  <div class="profile-card">

    <h1>PROFILE</h1>

    <div id="avatar" class="avatar">?</div>

    <h2 id="username">Loading...</h2>
    <p id="email">Loading...</p>

    <button class="main-btn" onclick="logout()">LOG OUT</button>

  </div>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

/* 🔥 WAIT FOR PAGE */
window.addEventListener("DOMContentLoaded", async () => {

  const avatarEl = document.getElementById("avatar");
  const usernameEl = document.getElementById("username");
  const emailEl = document.getElementById("email");

  const { data: { user } } = await supabase.auth.getUser();

  if(!user){
    location.href = "/auth.html";
    return;
  }

  emailEl.innerText = user.email;

  const { data } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  const username = data?.username || user.email.split("@")[0];

  usernameEl.innerText = username;
  avatarEl.innerText = username.charAt(0).toUpperCase();

});

/* LOGOUT */
window.logout = async () => {
  await supabase.auth.signOut();
  location.href="/auth.html";
};
</script>

</body>
</html>
