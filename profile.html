<!DOCTYPE html>
<html>
<head>
<title>PROFILE</title>
<link rel="stylesheet" href="/styles/main.css">

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://zsancpcyhdidrlezggrl.supabase.co",
  "sb_publishable_Hahozdb2FpB9cDsoWEEJzQ_WA_xdWV2"
);

const { data } = await supabase.auth.getSession();
const user = data?.session?.user;

if(!user){
  location.href="/auth.html";
}

window.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("email").innerText=user.email;
  document.getElementById("username").innerText=user.email.split("@")[0];
  document.getElementById("avatar").innerText=user.email.charAt(0).toUpperCase();
});

window.logout = async ()=>{
  await supabase.auth.signOut();
  location.href="/auth.html";
};
</script>

<style>
.profile-card{
  padding:30px;
  background:rgba(0,0,0,.6);
  border-radius:16px;
  text-align:center;
}
.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#00ffcc;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>

</head>

<body>

<div class="bg"></div>

<div class="container">
  <div class="profile-card">
    <h1>PROFILE</h1>
    <div id="avatar" class="avatar">?</div>
    <h2 id="username"></h2>
    <p id="email"></p>
    <button onclick="logout()">LOG OUT</button>
  </div>
</div>

</body>
</html>
